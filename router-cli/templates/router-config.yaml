# Mini-Gateway Router Configuration
# This file contains the configuration for your router setup

proxy:
  - name: "proxy1"
    listen: "127.0.0.1:8080"
    domains:
      - domain: "example.com"
        tls: false
        tls_cert: |
          -----BEGIN CERTIFICATE-----
          cert
          -----END CERTIFICATE-----
        tls_key: |
          -----BEGIN PRIVATE KEY-----
          key
          -----END PRIVATE KEY-----
        tls_autron: false  # Enable automatic TLS certificate generation via Let's Encrypt
        tls_mode: "staging"  # TLS mode when tls_autron is true: "staging" or "prod"
        tls_email: "admin@example.com"  # Email for Let's Encrypt (required when tls_autron is true)
    highspeed:
      enabled: true
      target: "gateway1"
    gateway:
      - name: "gateway1"
        domain: "example.com"
        target: "127.0.0.1:8080"
        path:
          - priority: 1
            pattern: "^(.*)$"
            target: "/$1"
          - priority: 2
            pattern: "^/api/debug/(.*)$"
            target: "/debug/$1"
          - priority: 3
            pattern: "^/health$"
            target: "/health"
