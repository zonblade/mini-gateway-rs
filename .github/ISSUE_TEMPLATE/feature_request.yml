name: Feature Request
description: Suggest a new feature or enhancement for Mini Gateway
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature. Please provide as much detail as possible so we can evaluate and prioritize your request.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is it related to a frustration or limitation?
      placeholder: I find it difficult to... / There is currently no way to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like to see.
      placeholder: It would be great if Mini Gateway could...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: I have tried... / An alternative approach could be...

  - type: dropdown
    id: component
    attributes:
      label: Related Component
      description: Which component would this feature apply to?
      options:
        - router-core
        - router-api
        - router-cli
        - router-rds
        - New component
        - Multiple / Unsure
    validations:
      required: true

  - type: dropdown
    id: willingness
    attributes:
      label: Contribution
      description: Are you willing to work on this feature?
      options:
        - "Yes, I can submit a PR"
        - "I can help with testing"
        - "I can help with documentation"
        - "No, I am only requesting"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, diagrams, or references about the feature request.
